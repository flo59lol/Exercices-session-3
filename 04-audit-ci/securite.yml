# Exercice 04 : la sécurité dans la CI
# À copier dans .github/workflows/securite.yml de votre projet
name: Sécurité

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --audit-level=high
      - name: Tests
        run: npm test

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Analyse Semgrep
        run: semgrep scan --config p/javascript --error
